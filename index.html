<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Reverse Noise-Cancelling Audio System - Vibrant UI</title>
  <style>
    :root {
      --bg-color: #0b0713;
      --card-bg: rgba(20, 14, 34, 0.85);
      --card-border: rgba(255, 255, 255, 0.12);
      --gradient-main: linear-gradient(135deg, #ff007f 0%, #7928ca 50%, #00f2fe 100%);
      --gradient-stop: linear-gradient(135deg, #ff3b30 0%, #a100ff 100%);
      --pink-neon: #ff007f;
      --cyan-neon: #00f2fe;
      --purple-neon: #a100ff;
      --text-main: #ffffff;
      --text-muted: #a39ebc;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background-color: var(--bg-color);
      color: var(--text-main);
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      margin: 0;
      background-image: 
        radial-gradient(circle at 15% 20%, rgba(255, 0, 127, 0.18) 0%, transparent 45%),
        radial-gradient(circle at 85% 80%, rgba(0, 242, 254, 0.18) 0%, transparent 45%),
        radial-gradient(circle at 50% 50%, rgba(161, 0, 255, 0.12) 0%, transparent 50%);
    }

    .card {
      background: var(--card-bg);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border: 1px solid var(--card-border);
      width: 100%;
      max-width: 520px;
      padding: 36px;
      border-radius: 24px;
      box-shadow: 
        0 20px 60px rgba(0, 0, 0, 0.8),
        inset 0 0 1px rgba(255, 255, 255, 0.2);
    }

    .header-badge {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      background: rgba(255, 0, 127, 0.15);
      border: 1px solid rgba(255, 0, 127, 0.3);
      color: #ff66c4;
      font-size: 11px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 1.2px;
      padding: 6px 14px;
      border-radius: 20px;
      margin-bottom: 16px;
      box-shadow: 0 0 12px rgba(255, 0, 127, 0.2);
    }

    .status-dot {
      width: 8px;
      height: 8px;
      background-color: var(--pink-neon);
      border-radius: 50%;
      box-shadow: 0 0 10px var(--pink-neon);
      transition: background-color 0.3s ease;
    }

    .status-dot.stopped {
      background-color: #5c5270;
      box-shadow: none;
    }

    h1 {
      font-size: 28px;
      font-weight: 800;
      margin: 0 0 10px 0;
      background: var(--gradient-main);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      letter-spacing: -0.5px;
    }

    p.description {
      color: var(--text-muted);
      font-size: 14px;
      line-height: 1.6;
      margin: 0 0 24px 0;
    }

    .action-group {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
      margin-bottom: 24px;
    }

    button {
      padding: 14px 16px;
      font-size: 13px;
      font-weight: 700;
      cursor: pointer;
      border: none;
      border-radius: 14px;
      transition: all 0.25s ease;
    }

    #engineSwitchBtn {
      background: var(--gradient-main);
      color: #ffffff;
      box-shadow: 0 4px 25px rgba(255, 0, 127, 0.4);
      grid-column: span 2;
    }

    #engineSwitchBtn.active {
      background: var(--gradient-stop);
      box-shadow: 0 4px 25px rgba(255, 59, 48, 0.4);
    }

    #engineSwitchBtn:hover {
      transform: translateY(-2px);
      filter: brightness(1.1);
    }

    #toggleButton {
      background: rgba(0, 242, 254, 0.1);
      color: var(--cyan-neon);
      border: 1px solid rgba(0, 242, 254, 0.3);
      box-shadow: 0 4px 15px rgba(0, 242, 254, 0.15);
    }

    #testSongBtn {
      background: rgba(161, 0, 255, 0.15);
      color: #d18aff;
      border: 1px solid rgba(161, 0, 255, 0.4);
      box-shadow: 0 4px 15px rgba(161, 0, 255, 0.15);
    }

    #toggleButton:hover:not(:disabled), #testSongBtn:hover:not(:disabled) {
      transform: translateY(-2px);
      filter: brightness(1.2);
    }

    #toggleButton:disabled, #testSongBtn:disabled {
      opacity: 0.35;
      cursor: not-allowed;
      transform: none;
    }

    .control-group {
      margin-bottom: 24px;
    }

    .control-label {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 10px;
      font-size: 14px;
      font-weight: 600;
    }

    .val-tag {
      font-weight: 800;
      font-family: monospace;
      font-size: 15px;
      padding: 2px 10px;
      border-radius: 8px;
    }

    .gain-val {
      color: var(--pink-neon);
      background: rgba(255, 0, 127, 0.15);
      border: 1px solid rgba(255, 0, 127, 0.25);
    }

    .media-val {
      color: var(--cyan-neon);
      background: rgba(0, 242, 254, 0.15);
      border: 1px solid rgba(0, 242, 254, 0.25);
    }

    input[type="range"] {
      -webkit-appearance: none;
      width: 100%;
      height: 8px;
      border-radius: 4px;
      outline: none;
      margin-bottom: 22px;
    }

    #ambientGainSlider {
      background: linear-gradient(to right, #3d1430, #ff007f);
    }

    #ambientGainSlider::-webkit-slider-thumb {
      -webkit-appearance: none;
      width: 22px;
      height: 22px;
      border-radius: 50%;
      background: #ffffff;
      border: 3px solid var(--pink-neon);
      cursor: pointer;
      box-shadow: 0 0 12px var(--pink-neon);
      transition: transform 0.15s ease;
    }

    #mediaGainSlider {
      background: linear-gradient(to right, #122b42, #00f2fe);
    }

    #mediaGainSlider::-webkit-slider-thumb {
      -webkit-appearance: none;
      width: 22px;
      height: 22px;
      border-radius: 50%;
      background: #ffffff;
      border: 3px solid var(--cyan-neon);
      cursor: pointer;
      box-shadow: 0 0 12px var(--cyan-neon);
      transition: transform 0.15s ease;
    }

    input[type="range"]::-webkit-slider-thumb:hover {
      transform: scale(1.2);
    }

    .canvas-container {
      padding: 3px;
      background: var(--gradient-main);
      border-radius: 16px;
      box-shadow: 0 8px 30px rgba(121, 40, 202, 0.3);
    }

    canvas {
      width: 100%;
      height: 125px;
      background: #07040e;
      border-radius: 13px;
      display: block;
    }
  </style>
</head>
<body>

  <div class="card">
    <div class="header-badge">
      <span class="status-dot stopped" id="statusDot"></span> Real-Time Audio DSP
    </div>
    
    <h1>Reverse Noise-Cancelling</h1>
    <p class="description">Amplify ambient background noise while isolating and suppressing human voice frequencies.</p>

    <div class="action-group">
      <button id="engineSwitchBtn">▶ Start Engine</button>
      <button id="toggleButton" disabled>Toggle: Boosted</button>
      <button id="testSongBtn" disabled>🎵 Play Test Music</button>
    </div>

    <div class="control-group">
      <div class="control-label">
        <span>Ambient Amplification Gain</span>
        <span class="val-tag gain-val"><span id="gainVal">250</span>x</span>
      </div>
      <input type="range" id="ambientGainSlider" min="1" max="500" value="250" step="1">

      <div class="control-label">
        <span>Test Song Volume</span>
        <span class="val-tag media-val"><span id="mediaVal">1.0</span>x</span>
      </div>
      <input type="range" id="mediaGainSlider" min="0" max="5" value="1" step="0.1">
    </div>

    <div class="canvas-container">
      <canvas id="visualizer" width="520" height="125"></canvas>
    </div>
  </div>

  <script>
    let audioCtx, micStream, micSource, masterMicGain, mediaGain, analyser;
    let isBypassed = false, engineRunning = false, songPlaying = false, songInterval = null;
    let animFrameId = null;

    function getAudioContext() {
      if (!audioCtx) {
        audioCtx = new (window.AudioContext || window.webkitAudioContext)({ latencyHint: 'interactive' });
      }
      if (audioCtx.state === 'suspended') audioCtx.resume();
      return audioCtx;
    }

    function startTestSong() {
      const ctx = getAudioContext();
      if (!mediaGain) {
        mediaGain = ctx.createGain();
        mediaGain.gain.value = parseFloat(document.getElementById('mediaGainSlider').value);
        mediaGain.connect(ctx.destination);
      }

      const notes = [261.63, 329.63, 392.00, 523.25, 440.00, 349.23];
      let step = 0;

      songInterval = setInterval(() => {
        if (!songPlaying) return;
        const osc = ctx.createOscillator();
        const noteGain = ctx.createGain();
        
        osc.type = step % 2 === 0 ? 'sawtooth' : 'triangle';
        osc.frequency.setValueAtTime(notes[step % notes.length], ctx.currentTime);
        
        noteGain.gain.setValueAtTime(0.2, ctx.currentTime);
        noteGain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.3);

        osc.connect(noteGain);
        noteGain.connect(mediaGain);

        osc.start();
        osc.stop(ctx.currentTime + 0.3);
        step++;
      }, 250);
    }

    function stopTestSong() {
      if (songInterval) clearInterval(songInterval);
      songPlaying = false;
      document.getElementById('testSongBtn').innerText = "🎵 Play Test Music";
    }

    async function startEngine() {
      try {
        micStream = await navigator.mediaDevices.getUserMedia({
          audio: { echoCancellation: false, noiseSuppression: false, autoGainControl: false }
        });

        const ctx = getAudioContext();
        micSource = ctx.createMediaStreamSource(micStream);

        // Voice Suppression Filters
        const voiceCut1 = ctx.createBiquadFilter();
        voiceCut1.type = 'peaking'; voiceCut1.frequency.value = 400; voiceCut1.Q.value = 0.5; voiceCut1.gain.value = -48;

        const voiceCut2 = ctx.createBiquadFilter();
        voiceCut2.type = 'peaking'; voiceCut2.frequency.value = 1200; voiceCut2.Q.value = 0.5; voiceCut2.gain.value = -50;

        const voiceCut3 = ctx.createBiquadFilter();
        voiceCut3.type = 'peaking'; voiceCut3.frequency.value = 2500; voiceCut3.Q.value = 0.5; voiceCut3.gain.value = -48;

        // Ambient Boost Filters
        const highBoost1 = ctx.createBiquadFilter();
        highBoost1.type = 'highshelf'; highBoost1.frequency.value = 3500; highBoost1.gain.value = 40;

        const lowBoost1 = ctx.createBiquadFilter();
        lowBoost1.type = 'lowshelf'; lowBoost1.frequency.value = 180; lowBoost1.gain.value = 36;

        masterMicGain = ctx.createGain();
        masterMicGain.gain.value = isBypassed ? 1.0 : parseFloat(document.getElementById('ambientGainSlider').value);

        const compressor = ctx.createDynamicsCompressor();
        compressor.threshold.value = -16; compressor.knee.value = 30; compressor.ratio.value = 20;

        analyser = ctx.createAnalyser();
        analyser.fftSize = 64;

        micSource
          .connect(voiceCut1).connect(voiceCut2).connect(voiceCut3)
          .connect(highBoost1).connect(lowBoost1)
          .connect(masterMicGain).connect(compressor).connect(analyser).connect(ctx.destination);

        const canvas = document.getElementById('visualizer');
        const canvasCtx = canvas.getContext('2d');
        const bufferLength = analyser.frequencyBinCount;
        const dataArray = new Uint8Array(bufferLength);

        function draw() {
          animFrameId = requestAnimationFrame(draw);
          analyser.getByteFrequencyData(dataArray);
          canvasCtx.fillStyle = '#07040e';
          canvasCtx.fillRect(0, 0, canvas.width, canvas.height);

          const barWidth = (canvas.width / bufferLength) * 1.5;
          let x = 0;
          for (let i = 0; i < bufferLength; i++) {
            const barHeight = dataArray[i] / 2.0;
            const gradient = canvasCtx.createLinearGradient(0, canvas.height, 0, 0);
            gradient.addColorStop(0, '#ff007f');
            gradient.addColorStop(0.5, '#7928ca');
            gradient.addColorStop(1, '#00f2fe');

            canvasCtx.fillStyle = isBypassed ? '#ff3b30' : gradient;
            canvasCtx.fillRect(x, canvas.height - barHeight, barWidth - 3, barHeight);
            x += barWidth;
          }
        }
        draw();

        engineRunning = true;
        document.getElementById('engineSwitchBtn').innerText = "⏹ Stop Engine";
        document.getElementById('engineSwitchBtn').classList.add('active');
        document.getElementById('statusDot').classList.remove('stopped');
        document.getElementById('toggleButton').disabled = false;
        document.getElementById('testSongBtn').disabled = false;
      } catch (err) {
        alert("Microphone Access Error: " + err.message);
      }
    }

    function stopEngine() {
      if (micStream) {
        micStream.getTracks().forEach(track => track.stop());
      }
      if (animFrameId) {
        cancelAnimationFrame(animFrameId);
      }
      stopTestSong();

      // Clear Canvas Visualizer
      const canvas = document.getElementById('visualizer');
      const canvasCtx = canvas.getContext('2d');
      canvasCtx.fillStyle = '#07040e';
      canvasCtx.fillRect(0, 0, canvas.width, canvas.height);

      engineRunning = false;
      document.getElementById('engineSwitchBtn').innerText = "▶ Start Engine";
      document.getElementById('engineSwitchBtn').classList.remove('active');
      document.getElementById('statusDot').classList.add('stopped');
      document.getElementById('toggleButton').disabled = true;
      document.getElementById('testSongBtn').disabled = true;
    }

    document.getElementById('engineSwitchBtn').addEventListener('click', () => {
      if (!engineRunning) {
        startEngine();
      } else {
        stopEngine();
      }
    });

    document.getElementById('testSongBtn').addEventListener('click', () => {
      songPlaying = !songPlaying;
      const btn = document.getElementById('testSongBtn');
      if (songPlaying) {
        btn.innerText = "⏹️ Stop Test Music";
        startTestSong();
      } else {
        btn.innerText = "🎵 Play Test Music";
        stopTestSong();
      }
    });

    document.getElementById('ambientGainSlider').addEventListener('input', (e) => {
      const val = parseFloat(e.target.value);
      document.getElementById('gainVal').innerText = val;
      if (masterMicGain && !isBypassed) masterMicGain.gain.value = val;
    });

    document.getElementById('mediaGainSlider').addEventListener('input', (e) => {
      const val = parseFloat(e.target.value);
      document.getElementById('mediaVal').innerText = val;
      if (mediaGain) mediaGain.gain.value = val;
    });

    document.getElementById('toggleButton').addEventListener('click', () => {
      isBypassed = !isBypassed;
      const val = parseFloat(document.getElementById('ambientGainSlider').value);
      if (masterMicGain) masterMicGain.gain.value = isBypassed ? 1.0 : val;
      document.getElementById('toggleButton').innerText = isBypassed ? "Toggle: Normal" : "Toggle: Boosted";
    });
  </script>

</body>
</html>
